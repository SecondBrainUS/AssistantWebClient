name: Build

# Builds and pushes the image. Deploying is Flux's job (homelab-k3s, KAN-120):
# it lists tags in the registry, picks the newest `<commit-epoch>-<sha7>` tag,
# commits it to homelab-k3s and rolls it out. Nothing here touches the cluster.
#
# The sortable tag uses the commit's own timestamp, not the build's, so
# re-running an old build can't jump ahead of a newer commit.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assistant-web-client/package-lock.json

      - name: Install dependencies
        working-directory: assistant-web-client
        run: npm ci

      - name: Run tests
        working-directory: assistant-web-client
        run: npm run test

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "v=$(git log -1 --format=%ct)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: docker.nyc.xelaxer.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./assistant-web-client
          platforms: linux/amd64
          push: true
          tags: |
            docker.nyc.xelaxer.com/sbaw_webclient:${{ steps.tag.outputs.v }}
            docker.nyc.xelaxer.com/sbaw_webclient:${{ github.sha }}
            docker.nyc.xelaxer.com/sbaw_webclient:latest
